name: CI

# Runs on every pull request and on the two long-lived branches. Nothing here
# deploys: Railway does that from the branch itself. This only answers "does it
# build, vet and pass its tests" before a merge rather than after one.
on:
  pull_request:
  push:
    branches: [main, testing/receipts-and-statements]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only the credit concurrency tests use this: SQLite runs one transaction at
    # a time, so it cannot show two requests overlapping. It exists for this job
    # alone and holds nothing.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        # insights_overview.go predates this check; take it off the list once
        # it has been formatted in a change of its own.
        run: |
          unformatted=$(gofmt -l cmd internal | grep -v '^internal/http/insights_overview.go$' || true)
          if [ -n "$unformatted" ]; then
            echo "gofmt needs to be run on:"; echo "$unformatted"; exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      # Most tests use an in-memory SQLite database. Without TEST_POSTGRES_DSN
      # the PostgreSQL ones skip, so it must stay set here.
      - name: Test
        env:
          TEST_POSTGRES_DSN: postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: go test ./...

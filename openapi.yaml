      responses:
        "201":
          description: Group created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SplitGroup"
        "422":
          description: Invalid group payload
    get:
      summary: List bill-splitting groups
      responses:
        "200":
          description: Groups
          content:
            application/json:
              schema:
                type: array
                items:

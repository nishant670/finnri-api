    get:
      summary: List a credit card's billing history, newest first
      responses:
        "200":
          description: Statements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CardStatement"
        "404":
          description: Card not found
    post:
      summary: Create or update the bill for one statement date
      description: >
        Upserts on (user, account, statement_date), so re-submitting a month
        corrects it rather than creating a second bill. The cycle window is
        derived from the card's statement day, and the due date is derived from
        its due day unless supplied.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardStatementInput"
      responses:
        "200":
          description: Statement updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardStatement"
        "201":
          description: Statement created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardStatement"
        "404":
          description: Card not found
        "422":
          description: Invalid statement fields
  /v1/statements/upcoming:
    get:
      summary: Every unsettled bill across all cards, soonest due first
      responses:
        "200":
          description: Upcoming statements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CardStatement"
  /v1/statements/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    get:
      summary: One statement with its payments and a fresh reconciliation
      responses:
        "200":
          description: Statement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardStatement"
        "404":
          description: Statement not found
    delete:
      summary: Delete a statement and the unitemized entry it owns
      description: >
        Real transactions in the cycle are untouched — they are the user's
        record of their own spending, not the statement's property.
      responses:
        "200":
          description: Deleted
        "404":
          description: Statement not found
  /v1/statements/{id}/payments:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    post:
      summary: Record a full or partial payment against a statement
      description: >
        Logs a payment the user made in their bank's app; Finnri never moves
        money. Partial payments are repeated calls. When from_account_id is
        given, one expense entry is written on that bank account carrying
        purpose_type "card_payment", which dashboard totals exclude.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardStatementPaymentInput"
      responses:
        "201":
          description: Payment recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardStatement"
        "404":
          description: Statement not found
        "409":
          description: Statement has no amount yet
        "422":
          description: Invalid payment fields
  /v1/statements/{id}/payments/{paymentId}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      - in: path
        name: paymentId
        required: true
        schema:
          type: integer
    delete:
      summary: Reverse a logged payment and the bank entry it created
      responses:
        "200":
          description: Payment removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardStatement"
        "404":
          description: Payment not found
  /v1/statements/{id}/diff:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    post:
      summary: Compare parsed statement lines against the ledger for that cycle
      description: >
        Stateless — nothing is stored. Returns matched, missing, extra and
        ignored buckets. Bill payments are classified into `ignored` and never
        offered for import: Finnri tracks payments on the statement rather than
        as card entries, so importing one would reduce the card's outstanding a
        second time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatementLinesInput"
      responses:
        "200":
          description: The diff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatementDiff"
        "404":
          description: Statement not found
        "422":
          description: Invalid lines
  /v1/statements/{id}/import:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    post:
      summary: Create entries for the lines the user selected
      description: >
        Idempotent per line — re-importing the same statement cannot duplicate
        a transaction. Re-reconciles afterwards, which is what shrinks the
        unitemized bucket.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatementLinesInput"
      responses:
        "200":
          description: Import result with the fresh reconciliation
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported:
                    type: integer
                  reconciliation:
                    $ref: "#/components/schemas/CardStatementReconciliation"
        "404":
          description: Statement not found
        "422":
          description: Invalid lines
  /v1/statements/{id}/upload:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    post:
      summary: Read a statement PDF and return the diff
      description: >
        The file and password live for the duration of the request only.
        Neither is written to disk, stored, or logged, and there is deliberately
        no way to remember a password. Card numbers are masked out of the
        extracted text before parsing, so no full PAN travels with the parsed
        rows. The response carries the parsed lines for the client to review and
        pass to the import endpoint — there is no server-side parsed statement.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                password:
                  type: string
                  description: Used once to decrypt, then discarded. Never stored.
      responses:
        "200":
          description: The diff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatementDiff"
        "404":
          description: Statement not found
        "422":
          description: >
            invalid_statement_pdf, statement_password_required,
            statement_password_incorrect, statement_unreadable, or
            no_transactions_found
  /v1/statements/{id}/screenshots:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    post:
      summary: Read cropped statement screenshots with AI and return the diff
      description: >
        Accepts up to eight ordered JPEG, PNG or WebP images. Images are sent to
        the configured OpenAI service for structured extraction, held only for
        this request, and never stored by Finnri. Exact overlapping rows are
        collapsed with the same idempotency key used by import. The checksum is
        advisory: a mismatch never prevents review or selective import.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [images]
              properties:
                images:
                  type: array
                  minItems: 1
                  maxItems: 8
                  items:
                    type: string
                    format: binary
      responses:
        "200":
          description: The normal statement diff plus screenshot checksum and AI credit usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatementDiff"
        "402":
          description: AI plan or credits required
        "404":
          description: Statement not found
        "413":
          description: Image batch too large
        "415":
          description: Unsupported image type
        "422":
          description: No transaction rows found or too many images
        "502":
          description: AI provider could not read the screenshots
  /v1/accounts/{id}/emi-plans:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
        description: Credit card account id
    get:
      summary: List EMI plans on a credit card
      responses:
        "200":
          description: Plans, each with derived progress
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CardEMIPlan"
        "404":
          description: Card not found
    post:
      summary: Convert a purchase on this card to instalments
      description: >
        Blocks the full principal against the card's limit straight away and
        releases it a slice at a time as each instalment's principal is paid.
        Passing source_entry_id converts a purchase already in the ledger; that
        entry is removed, because the card bills instalments rather than the
        purchase and leaving it would double-count the spend.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardEMIPlanInput"
      responses:
        "201":
          description: Plan created with its instalment schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardEMIPlan"
        "404":
          description: Card not found
        "422":
          description: Invalid plan fields
  /v1/emi-plans/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    get:
      summary: One EMI plan with its full instalment schedule
      responses:
        "200":
          description: Plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardEMIPlan"
        "404":
          description: Plan not found
    delete:
      summary: Delete a plan and the instalment entries it generated
      description: >
        Removes only entries this plan wrote. Transactions the user recorded
        themselves are untouched.
      responses:
        "200":
          description: Deleted
        "404":
          description: Plan not found
  /v1/emi-plans/{id}/foreclose:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    post:
      summary: Pay a plan off early, releasing all remaining principal at once
      description: >
        Cancels every instalment still scheduled. Instalments already billed
        are kept — they sit on a statement the user still owes, and cancelling
        them would erase a charge the bank has made.
      responses:
        "200":
          description: Plan foreclosed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardEMIPlan"
        "404":
          description: Plan not found
        "409":
          description: Plan is not active
  /v1/tools/emi/calculate:
    post:
      summary: Calculate EMI summary and amortization schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EMICalculationInput"
      responses:
        "200":
          description: EMI calculation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EMICalculation"
        "422":
          description: Invalid EMI fields
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    TransactionReport:
      type: object
      required: [summary, by_category, by_merchant, by_account, by_month, by_type]
      properties:
        summary:
          type: object
          required: [total_expense, total_income, net_cashflow, transaction_count, expense_count, income_count]
          properties:
            total_expense:
              type: number
            total_income:
              type: number
            net_cashflow:
              type: number
            transaction_count:
              type: integer
            expense_count:
              type: integer
            income_count:
              type: integer
        by_category:
          type: array
          items:
            $ref: "#/components/schemas/TransactionReportBreakdown"
        by_merchant:
          type: array
          items:
            $ref: "#/components/schemas/TransactionReportBreakdown"
        by_account:
          type: array
          items:
            $ref: "#/components/schemas/TransactionAccountReportBreakdown"
        by_month:
          type: array
          items:
            $ref: "#/components/schemas/TransactionMonthlyReportBreakdown"
        by_type:
          type: array
          items:
            $ref: "#/components/schemas/TransactionTypeReportBreakdown"
    TransactionReportBreakdown:
      type: object
      required: [key, label, amount, percentage, transaction_count]
      properties:
        key:
          type: string
        label:
          type: string
        amount:
          type: number
        percentage:
          type: number
        transaction_count:
          type: integer
    TransactionAccountReportBreakdown:
      type: object
      required: [account_name, amount, percentage, transaction_count]
      properties:
        account_id:
          type: [integer, "null"]
        account_name:
          type: string
        amount:
          type: number
        percentage:
          type: number
        transaction_count:
          type: integer
    TransactionMonthlyReportBreakdown:
      type: object
      required: [month, expense, income, net_cashflow, transaction_count]
      properties:
        month:
          type: string
          pattern: "^\\d{4}-\\d{2}$"
        expense:
          type: number
        income:
          type: number
        net_cashflow:
          type: number
        transaction_count:
          type: integer
    TransactionTypeReportBreakdown:
      type: object
      required: [type, amount, transaction_count]
      properties:
        type:
          type: string
          enum: [expense, income]
        amount:
          type: number
        transaction_count:
          type: integer
    Dashboard:
      type: object
      required: [period, summary, top_categories, top_merchants, account_spending, budget_statuses, daily_spending, recent_transactions, review_items, insights, recurring_candidates]
      properties:
        period:
          type: object
          required: [start, end, previous_start, previous_end, comparison_kind, comparison_label]
          properties:
            start:
              type: string
              format: date
            end:
              type: string
              format: date
            previous_start:
              type: string
              format: date
              description: Start of the window every change on this response is measured against.
            previous_end:
              type: string
              format: date
            comparison_kind:
              type: string
              enum: [same_days_previous_month, preceding_period]
              description: >-
                How the previous window was chosen. A range starting on the 1st and ending inside
                the same month compares against the same days of the previous month; any other
                range compares against the equal-length window immediately before it.
            comparison_label:
              type: string
              description: The comparison stated for display, e.g. "Aug 1-11 vs Jul 1-11".
        summary:
          type: object
          required:
            [
              total_spent,
              total_income,
              daily_average,
              transaction_count,
              lifetime_transaction_count,
              previous_total_spent,
              spend_change,
              spend_change_comparable,
            ]
          properties:
            total_spent:
              type: number
            total_income:
              type: number
            daily_average:
              type: number
            transaction_count:
              type: integer
            lifetime_transaction_count:
              type: integer
              description: Total entries recorded by the user across all dates; used for progressive insight unlocks.
            previous_total_spent:
              type: number
              description: Expense total for the window named by period.previous_start/previous_end.
            spend_change:
              type: number
              description: >-
                Percent change in total spend against the previous window. Always 0 when
                spend_change_comparable is false — read that flag first, never this value alone.
            spend_change_comparable:
              type: boolean
              description: >-
                False when the previous window was too thin to divide by (under ₹500 or fewer
                than 5 transactions). Show no comparison at all rather than a percentage that
                describes a near-empty base.
        top_categories:
          type: array
          description: >-
            The complete expense breakdown for the window, highest amount first — despite the
            name, not just the top few. Capped at 25 entries so the payload stays bounded for a
            user with many custom categories; whatever falls outside the list is still counted in
            summary.total_spent, which is what an "Other" rollup is derived from.
          items:
            $ref: "#/components/schemas/DashboardCategory"
        top_merchants:
          type: array
          items:
            $ref: "#/components/schemas/DashboardMerchant"
        account_spending:
          type: array
          items:
            $ref: "#/components/schemas/DashboardAccount"
        budget_statuses:
          type: array
          items:
            $ref: "#/components/schemas/DashboardBudgetStatus"
        daily_spending:
          type: array
          items:
            $ref: "#/components/schemas/DashboardDailySpend"
        recent_transactions:
          type: array
          items:
            $ref: "#/components/schemas/SavedEntry"
        review_items:
          type: array
          items:
            $ref: "#/components/schemas/DashboardReviewItem"
        insights:
          type: array
          items:
            $ref: "#/components/schemas/InsightCard"
        recurring_candidates:
          type: array
          items:
            $ref: "#/components/schemas/DashboardRecurringCandidate"
        overview:
          $ref: "#/components/schemas/DashboardOverview"
    DashboardOverview:
      type: object
      required: [has_history, months_tracked, lifetime_spent, lifetime_income, lifetime_transaction_count, average_monthly_spend, typical_monthly_spend, recent_months, top_category_amount, top_category_share]
      description: >-
        What the Insights tab knows regardless of which period is selected.
        Deliberately not filtered by start_date/end_date: everything else on the
        response is, which is why the tab went blank every month until the first
        transaction was captured. A window with nothing in it is not the same
        thing as an account with nothing in it, and a single month means little
        without the months either side to read it against.
      properties:
        has_history:
          type: boolean
          description: >-
            False only for a genuinely new account — the one case where an empty
            screen is the honest one.
        tracked_since:
          type: string
          format: date
          description: Date of the first transaction ever recorded.
        months_tracked:
          type: integer
        lifetime_spent:
          type: number
        lifetime_income:
          type: number
        lifetime_transaction_count:
          type: integer
        average_monthly_spend:
          type: number
          description: Mean over the last six months that had activity.
        typical_monthly_spend:
          type: number
          description: >-
            Median over the same months. Lead with this one: a single holiday or
            insurance renewal drags the mean far enough to make an ordinary
            month look frugal. Both figures exclude the current month, which is
            partial by definition — on the 4th it describes four days.
        baseline_months:
          type: integer
          description: >-
            How many complete months backed the two figures above. Check it
            before calling anything "typical": one or two months is a sample,
            not a habit.
        recent_months:
          type: array
          description: >-
            The last twelve calendar months, oldest first, including the ones
            with no activity — dropping those compresses time and draws a gap as
            a decline.
          items:
            $ref: "#/components/schemas/DashboardOverviewMonth"
        last_active_month:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/DashboardOverviewMonth"
          description: >-
            The most recent month with any activity. This is what turns an empty
            selected period from a dead end into one tap to where the data is.
        top_category:
          type: string
          description: Largest expense category across the last six months.
        top_category_amount:
          type: number
        top_category_share:
          type: number
          description: That category's percentage of the window's spend.
        top_category_months:
          type: integer
          description: >-
            How many months that window actually spans, capped by how long the
            account has existed. Saying "over six months" to a three-month-old
            account describes a period half of which it did not exist for.
    DashboardOverviewMonth:
      type: object
      required: [month, label, spent, income, count]
      properties:
        month:
          type: string
          description: YYYY-MM.
        label:
          type: string
          description: Short month name for the strip.
        spent:
          type: number
        income:
          type: number
        count:
          type: integer
    DashboardCategory:
      type: object
      required: [category, amount, percentage, change, change_comparable]
      properties:
        category:
          type: string
        amount:
          type: number
        percentage:
          type: number
        change:
          type: number
          description: >-
            Percentage change against the previous window. Always 0 when change_comparable is
            false, so clients that only read this field show no trend rather than a false one.
        change_comparable:
          type: boolean
          description: >-
            False when the previous window held less than the floor needed to divide by
            (at least 500 rupees and at least 5 transactions in that category).
    DashboardMerchant:
      type: object
      required: [merchant, amount, transaction_count]
      properties:
        merchant:
          type: string
        amount:
          type: number
        transaction_count:
          type: integer
    DashboardDailySpend:
      type: object
      required: [date, amount, count]
      properties:
        date:
          type: string
          format: date
        amount:
          type: number
        count:
          type: integer
    DashboardReviewItem:
      allOf:
        - $ref: "#/components/schemas/SavedEntry"
        - type: object
          required: [category_suggestions]
          properties:
            category_suggestions:
              type: array
              items:
                type: string
    DashboardAccount:
      type: object
      required: [account_name, amount, percentage]
      properties:
        account_id:
          type: [integer, "null"]
        account_name:
          type: string
        amount:
          type: number
        percentage:
          type: number
    DashboardBudgetStatus:
      type: object
      required: [budget_id, name, category, limit_amount, spent_amount, remaining_amount, percentage, alert_threshold_percent, days_left, status]
      properties:
        budget_id:
          type: integer
        name:
          type: string
        category:
          type: string
        limit_amount:
          type: number
        spent_amount:
          type: number
        remaining_amount:
          type: number
        percentage:
          type: number
        alert_threshold_percent:
          type: integer
        days_left:
          type: integer
        status:
          type: string
          enum: [safe, watch, exceeded]
    DashboardRecurringCandidate:
      type: object
      required: [candidate_key, label, merchant, category, average_amount, interval_guess, confidence, occurrences, last_seen_date, next_expected_date, review_due]
      properties:
        candidate_key:
          type: string
        label:
          type: string
        merchant:
          type: string
        category:
          type: string
        average_amount:
          type: number
        interval_guess:
          type: string
          enum: [weekly, monthly]
        confidence:
          type: number
          minimum: 0
          maximum: 1
        occurrences:
          type: integer
        last_seen_date:
          type: string
          format: date
        next_expected_date:
          type: string
          format: date
        review_due:
          type: boolean
    TrackRecurringCandidatesInput:
      type: object
      properties:
        candidate_keys:
          type: array
          items:
            type: string
          description: Candidate keys to track. Empty or omitted tracks all current candidates.
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
    TrackRecurringCandidatesResponse:
      type: object
      required: [tracked, skipped]
      properties:
        tracked:
          type: array
          items:
            type: object
            required: [candidate_key, subscription]
            properties:
              candidate_key:
                type: string
              subscription:
                $ref: "#/components/schemas/Subscription"
        skipped:
          type: array
          items:
            type: object
            required: [candidate_key, reason]
            properties:
              candidate_key:
                type: string
              reason:
                type: string
    RecurringCandidateDecisionInput:
      type: object
      required: [decision]
      properties:
        candidate_key:
          type: string
        merchant:
          type: string
        category:
          type: string
        decision:
          type: string
          enum: [dismissed, snoozed, tracked]
        snoozed_until:
          type: string
          format: date
    RecurringCandidateDecision:
      allOf:
        - $ref: "#/components/schemas/RecurringCandidateDecisionInput"
        - type: object
          required: [id, user_id, candidate_key, merchant, category, decision, last_reviewed_at, created_at, updated_at]
          properties:
            id:
              type: integer
            user_id:
              type: integer
            last_reviewed_at:
              type: string
              format: date-time
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    InsightCard:
      type: object
      required: [kind, severity, title, body]
      properties:
        kind:
          type: string
          enum: [period_comparison, category_increase, top_merchant, account_usage, unusual_spending, recurring_candidate, budget_watch, budget_exceeded]
        severity:
          type: string
          enum: [info, warning, success]
        title:
          type: string
        body:
          type: string
        explanation:
          type: string
        action_label:
          type: string
        category:
          type: string
        merchant:
          type: string
        budget_id:
          type: integer
        account_id:
          type: integer
          nullable: true
        account_name:
          type: string
        amount:
          type: number
        limit_amount:
          type: number
        remaining_amount:
          type: number
        status:
          type: string
        percentage:
          type: number
        change_percentage:
          type: number
        transaction_count:
          type: integer
        next_expected_date:
          type: string
          format: date
        confidence:
          type: number
          minimum: 0
          maximum: 1
    MonthlyReview:
      type: object
      required: [month, label, previous_label, start_date, end_date, available, summary]
      properties:
        month:
          type: string
          example: "2026-08"
        label:
          type: string
          example: August 2026
        previous_label:
          type: string
          description: The month every change on this response is measured against.
          example: July
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        available:
          type: boolean
          description: False when the month held too little to describe. The screen says so rather than rendering a story about nothing.
        summary:
          type: object
          description: The same summary shape `/v1/dashboard` returns, over the whole month.
          properties:
            total_spent:
              type: number
            total_income:
              type: number
            daily_average:
              type: number
            transaction_count:
              type: integer
            previous_total_spent:
              type: number
            spend_change:
              type: number
            spend_change_comparable:
              type: boolean
              description: False when the previous month was too thin to divide by; `spend_change` is 0 and must not be shown.
        top_categories:
          type: array
          items:
            $ref: "#/components/schemas/DashboardCategory"
        top_merchants:
          type: array
          items:
            $ref: "#/components/schemas/DashboardMerchant"
        daily_spending:
          type: array
          items:
            $ref: "#/components/schemas/DashboardDailySpend"
        biggest_change:
          type: object
          nullable: true
          description: >-
            The category that moved the most *rupees*, not the most percent —
            ranking on percentage always crowns the smallest category. Absent
            when nothing moved far enough to be a month's story.
          properties:
            category:
              type: string
            amount:
              type: number
            previous_amount:
              type: number
            change:
              type: number
              description: Only meaningful when `comparable` is true.
            comparable:
              type: boolean
              description: False when the previous month was too thin to divide by.
            direction:
              type: string
              enum: [higher, lower]
        busiest_day:
          nullable: true
          $ref: "#/components/schemas/DashboardDailySpend"
        notified_at:
          type: string
          format: date-time
          description: Set when the review notification for this month has already been sent.
    ExpenseOrIncomeEntry:
      $ref: ./schemas/expense_entry.schema.json
    LedgerAnswerResponse:
      type: object
      required: [stage, intent, source_text, answer]
      properties:
        stage:
          type: string
          enum: [answer]
        intent:
          type: string
          enum: [question]
        source_text:
          type: string
        answer:
          $ref: "#/components/schemas/LedgerAnswer"
        credits_charged:
          type: integer
        credits_remaining_today:
          type: integer
        credits_remaining_total:
          type: integer
        plan_code:
          type: string
    LedgerAnswer:
      type: object
      required: [status, metric, currency, transaction_count, period, breakdown, suggestions, filters]
      properties:
        status:
          type: string
          enum: [answered, no_data, unsupported]
          description: >-
            `no_data` means the query was valid and matched nothing.
            `unsupported` means the question cannot be answered from the ledger;
            it always carries a message and never carries an amount.
        metric:
          type: string
          enum: [spend_total, income_total, net, count, average, largest, breakdown, unsupported]
        amount:
          type: [number, "null"]
          description: Major units. Null for a count and for any answer that is not `answered`. Clients format it; the API never sends a currency symbol.
        currency:
          type: string
        transaction_count:
          type: integer
        subject:
          type: string
          description: What the question was about, in the ledger's own vocabulary — a canonical category, a merchant, a payment mode.
        entry_type:
          type: string
          enum: [expense, income]
        period:
          type: object
          required: [kind, label]
          properties:
            kind:
              type: string
            label:
              type: string
              description: The period in words, to be shown beside the number so the window the answer covers is always stated.
            start_date:
              type: string
              format: date
            end_date:
              type: string
              format: date
        group_by:
          type: string
          enum: [category, merchant, month, none]
        breakdown:
          type: array
          items:
            type: object
            required: [label, amount, transaction_count, percentage]
            properties:
              label:
                type: string
              amount:
                type: number
              transaction_count:
                type: integer
              percentage:
                type: number
        largest_entry:
          type: object
          properties:
            entry_id:
              type: integer
            title:
              type: string
            merchant:
              type: string
            category:
              type: string
            amount:
              type: number
            date:
              type: string
              format: date
        reason:
          type: string
          enum: [forecast, advice, non_ledger, splits, budgets, too_complex]
        message:
          type: string
          description: Server-authored explanation for an unsupported question. Never model prose.
        suggestions:
          type: array
          items:
            type: string
        filters:
          type: object
          additionalProperties:
            type: string
          description: >-
            The exact `GET /v1/entries` query parameters the figures were
            computed over. Clients hand these straight to the transaction list so
            the rows behind an answer are the rows it counted.
    FinalEntry:
      $ref: ./schemas/final_entry.schema.json
    UpdateEntry:
      type: object
      additionalProperties: false
      required: [account_id]
      properties:
        title:
          type: string
        type:
          type: string
          enum: [expense, income]
        amount:
          oneOf:
            - type: number
              exclusiveMinimum: 0
              multipleOf: 0.01
            - type: string
              pattern: "^[0-9]+(\\.[0-9]{1,2})?$"
        currency:
          type: string
          const: INR
        source:
          type: string
          enum: [manual, text, voice]
        account_id:
          type: integer
          minimum: 1
        mode:
          type: string
          enum: [Cash, Bank Account, UPI, Credit Card, Wallets]
        category:
          type: string
        merchant:
          type: string
        notes:
          type: string
        date:
          type: string
          format: date
        time:
          type: string
        tag:
          type: string
        refundable_amount:
          nullable: true
          oneOf:
            - type: number
              exclusiveMinimum: 0
              multipleOf: 0.01
            - type: string
              pattern: "^[0-9]+(\\.[0-9]{1,2})?$"
        refund_expected_on:
          type: [string, "null"]
          format: date
        refund_reminder_at:
          type: [string, "null"]
          format: date-time
        refund_status:
          type: [string, "null"]
          enum: [pending, received, written_off, null]
        split:
          description: Omit to leave the linked split unchanged, send null to remove it, or send an object to replace it atomically with the entry update.
          oneOf:
            - $ref: "#/components/schemas/EntryLinkedSplitInput"
            - type: "null"
    EntryLinkedSplitInput:
      type: object
      required: [participants]
      additionalProperties: false
      properties:
        group_id:
          type: [integer, "null"]
          minimum: 1
        group_name:
          type: string
        notes:
          type: string
        participants:
          type: array
          minItems: 1
          items:
            type: object
            required: [share_amount]
            additionalProperties: false
            properties:
              friend_id:
                type: integer
                minimum: 1
              friend:
                type: object
                required: [name]
                additionalProperties: false
                properties:
                  name:
                    type: string
                  email:
                    type: string
                  phone:
                    type: string
              share_amount:
                oneOf:
                  - type: number
                    exclusiveMinimum: 0
                    multipleOf: 0.01
                  - type: string
                    pattern: "^[0-9]+(\\.[0-9]{1,2})?$"
              direction:
                type: string
                enum: [friend_owes_user, user_owes_friend]
    SavedEntry:
      allOf:
        - $ref: "#/components/schemas/FinalEntry"
        - type: object
          properties:
            id:
              type: integer
            account:
              $ref: "#/components/schemas/Account"
            source:
              type: string
              enum: [manual, text, voice]
            source_text:
              type: string
    EntryPage:
      type: object
      required: [entries, page, page_size, total, total_pages]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/SavedEntry"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
        category_counts:
          type: object
          description: >-
            Entries per category across the whole filtered set, counted with the
            category filter itself omitted — each value answers "how many would I
            get if I picked this one". Legacy names are folded onto their
            canonical category. Absent categories are absent, not zero.
          additionalProperties:
            type: integer
    Categories:
      type: object
      required: [categories, default, income_categories, income_default]
      properties:
        categories:
          type: array
          description: Canonical category names, in picker order.
          items:
            type: string
          example: ["Food & Drinks", "Transport", "Travel", "Shopping", "Bills", "Entertainment", "Family/Gifts", "Misc"]
        default:
          type: string
          description: >-
            The confirm-first fallback used when a category is unknown. Always a
            member of `categories`.
          example: "Misc"
        income_categories:
          type: array
          description: Canonical income category names, in picker order.
          items:
            type: string
          example: ["Salary", "Freelance", "Interest", "Refund", "Other"]
        income_default:
          type: string
          description: The confirm-first fallback for an unknown income source.
          example: "Other"
    MerchantSuggestions:
      type: object
      required: [suggestions]
      properties:
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/MerchantSuggestion"
    MerchantSuggestion:
      type: object
      required: [merchant, category, transaction_count, last_seen_date]
      properties:
        merchant:
          type: string
        category:
          type: string
        transaction_count:
          type: integer
        last_seen_date:
          type: string
          format: date
    AccountInput:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [cash, upi, bank, credit_card, debit_card, wallet, other]
        provider:
          type: string
        identifier:
          type: string
          description: Legacy display fallback. Prefer the type-specific field.
        provider_id:
          type: string
          description: Stable id from the account provider catalogue.
        last4:
          type: string
          pattern: "^[0-9]{4}$"
        upi_handle:
          type: string
        wallet_nickname:
          type: string
        account_nickname:
          type: string
        credit_limit:
          type: number
          multipleOf: 0.01
          minimum: 0
        due_day:
          type: integer
          minimum: 0
          maximum: 31
        statement_day:
          type: integer
          minimum: 0
          maximum: 31
        reminder_days_before:
          type: integer
          minimum: 0
          maximum: 30
        reminder_enabled:
          type: boolean
        autopay_enabled:
          type: boolean
        fee_month:
          type: string
        balance:
          type: number
          multipleOf: 0.01
        is_default:
          type: boolean
        auto_created:
          type: boolean
          description: Marks an account created from the capture shortcut until the user reviews it.
    Account:
      type: object
      required: [id, name, type]
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
          enum: [cash, upi, bank, credit_card, debit_card, wallet, other]
        provider:
          type: string
        identifier:
          type: string
        provider_id:
          type: string
        provider_details:
          $ref: "#/components/schemas/AccountProvider"
        last4:
          type: string
        upi_handle:
          type: string
        wallet_nickname:
          type: string
        account_nickname:
          type: string
        credit_limit:
          type: number
          multipleOf: 0.01
        due_day:
          type: integer
        statement_day:
          type: integer
        reminder_days_before:
          type: integer
        reminder_enabled:
          type: boolean
        autopay_enabled:
          type: boolean
        card_ledger_reset_at:
          type: string
          format: date-time
        fee_month:
          type: string
        balance:
          type: number
          multipleOf: 0.01
          description: >-
            Opening balance — what the account held, or on a card owed, before the
            first logged transaction. Never a current figure on its own.
        is_default:
          type: boolean
        auto_created:
          type: boolean
          description: True until the user first edits an account created from the capture shortcut.
    AccountProvider:
      type: object
      required: [id, display_name, type_support, asset_key]
      properties:
        id:
          type: string
        display_name:
          type: string
        type_support:
          type: array
          items:
            type: string
            enum: [cash, upi, bank, credit_card, debit_card, wallet, other]
        asset_key:
          type: string
          description: Local visual key; clients choose the actual bundled icon.
        aliases:
          type: array
          items:
            type: string
    AccountWithSummary:
      allOf:
        - $ref: "#/components/schemas/Account"
        - type: object
          required: [summary]
          properties:
            summary:
              $ref: "#/components/schemas/AccountSummary"
    AccountSummary:
      type: object
      description: >-
        Figures derived from the account's entries. Nothing here is user-entered.
        Month-to-date runs from the 1st to today, matching the dashboard's default
        range so the two screens cannot disagree about the same account.
      required:
        [
          spent_this_month,
          received_this_month,
          entries_this_month,
          lifetime_spent,
          lifetime_received,
          entries_total,
        ]
      properties:
        spent_this_month:
          type: number
        received_this_month:
          type: number
        entries_this_month:
          type: integer
        lifetime_spent:
          type: number
        lifetime_received:
          type: number
        entries_total:
          type: integer
        last_activity_date:
          type: string
          format: date
          description: Most recent entry date. Absent when the account has never been used.
        outstanding:
          type: number
          description: >-
            Credit cards only — opening balance plus lifetime spend minus payments
            and refunds. This, never credit_limit, is what a card row shows as money.
        credit_utilisation:
          type: number
          description: >-
            Credit cards with a limit only. Percentage of the limit in use; may
            exceed 100 when the card is over its limit, and is 0 for a card in credit.
        running_balance:
          type: number
          description: >-
            Non-card accounts with an opening balance only — opening plus money in
            minus money out. Absent otherwise, because net flow is not a balance.
    BudgetInput:
      type: object
      required: [name, limit_amount]
      properties:
        name:
          type: string
          maxLength: 120
        period:
          type: string
          enum: [monthly]
          default: monthly
        category:
          type: string
          description: Empty means all expense categories.
          maxLength: 80
        limit_amount:
          oneOf:
            - type: number
              exclusiveMinimum: 0
              multipleOf: 0.01
            - type: string
              pattern: "^[0-9]+(\\.[0-9]{1,2})?$"
        currency:
          type: string
          const: INR
          default: INR
        alert_threshold_percent:
          type: integer
          minimum: 1
          maximum: 100
          default: 80
        active:
          type: boolean
          default: true
    Budget:
      allOf:
        - $ref: "#/components/schemas/BudgetInput"
        - type: object
          required: [id, user_id, name, period, category, limit_amount, currency, alert_threshold_percent, active, created_at, updated_at]
          properties:
            id:
              type: integer
            user_id:
              type: integer
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    StatementAlertInput:
      type: object
      required: [text, channel]
      properties:
        text:
          type: string
          maxLength: 4000
        channel:
          type: string
          enum: [sms, email]
        received_at:
          type: string
          format: date
          description: Defaults to today and becomes the statement date when the alert omits one.
    CardStatementInput:
      type: object
      required: [statement_date, total_due]
      properties:
        statement_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
          description: Derived from the card's due day when omitted. Must be after the statement date.
        total_due:
          oneOf:
            - type: number
              minimum: 0
              multipleOf: 0.01
            - type: string
              pattern: "^[0-9]+(\\.[0-9]{1,2})?$"
        minimum_due:
          oneOf:
            - type: number
              minimum: 0
              multipleOf: 0.01
            - type: string
              pattern: "^[0-9]+(\\.[0-9]{1,2})?$"
        currency:
          type: string
          enum: [INR]
        source:
          type: string
          enum: [manual, sms, email]
        notes:
          type: string
    CardStatementPaymentInput:
      type: object
      required: [amount]
      properties:
        amount:
          oneOf:
            - type: number
              exclusiveMinimum: 0
              multipleOf: 0.01
            - type: string
              pattern: "^[0-9]+(\\.[0-9]{1,2})?$"
        paid_on:
          type: string
          format: date
          description: Defaults to today.
        method:
          type: string
          maxLength: 24
        from_account_id:
          type: [integer, "null"]
          description: Bank account the money left. Cannot be the card being paid.
        note:
          type: string
    CardStatementPayment:
      type: object
      required: [id, user_id, statement_id, account_id, amount, paid_on]
      properties:
        id:
          type: integer
        user_id:
          type: integer
        statement_id:
          type: integer
        account_id:
          type: integer
        from_account_id:
          type: [integer, "null"]
        bank_entry_id:
          type: [integer, "null"]
        amount:
          type: number
        paid_on:
          type: string
          format: date
        method:
          type: string
        note:
          type: string
        created_at:
          type: string
          format: date-time
    CardStatementReconciliation:
      type: object
      description: >
        What the bill can and cannot account for. When state is "balanced",
        itemized_total + unitemized_amount + previous_unpaid == statement_total.
      required: [cycle_start, cycle_end, itemized_total, statement_total, gap, state]
      properties:
        cycle_start:
          type: string
          format: date
        cycle_end:
          type: string
          format: date
        itemized_total:
          type: number
          description: Net spend on the card inside the cycle, excluding the unitemized entry.
        entries_count:
          type: integer
        previous_unpaid:
          type: number
          description: Unpaid remainder of the previous statement, rolled into this bill.
        statement_total:
          type: number
        unitemized_amount:
          type: number
          description: Billed but not explained by the ledger; held as a real expense entry.
        gap:
          type: number
          description: Signed. Positive when the bank knows more than Finnri does.
        state:
          type: string
          enum: [balanced, under, over]
    CardStatement:
      type: object
      required: [id, user_id, account_id, cycle_start, cycle_end, statement_date, due_date, total_due, paid_amount, status]
      properties:
        id:
          type: integer
        user_id:
          type: integer
        account_id:
          type: integer
        cycle_start:
          type: string
          format: date
        cycle_end:
          type: string
          format: date
        statement_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
        total_due:
          type: number
        minimum_due:
          type: number
        paid_amount:
          type: number
        remaining_due:
          type: number
        currency:
          type: string
        status:
          type: string
          enum: [draft, unpaid, partial, paid]
          description: >
            "draft" is a placeholder opened on the statement day before the
            amount is known. "overdue" is never stored — read is_overdue.
        is_overdue:
          type: boolean
        days_to_due:
          type: integer
          description: Negative once the due date has passed.
        source:
          type: string
          enum: [manual, sms, email]
        unitemized_entry_id:
          type: [integer, "null"]
        notes:
          type: string
        reconciliation:
          $ref: "#/components/schemas/CardStatementReconciliation"
        payments:
          type: array
          items:
            $ref: "#/components/schemas/CardStatementPayment"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    StatementLine:
      type: object
      required: [date, amount]
      properties:
        date:
          type: string
          format: date
        description:
          type: string
        amount:
          type: number
          description: Always positive. Direction comes from `type`.
        type:
          type: string
          enum: [expense, income]
          default: expense
        kind:
          type: string
          enum: [spend, refund, payment, fee, interest, emi]
          description: Derived by the server, not supplied.
    StatementLinesInput:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/StatementLine"
    StatementDiff:
      type: object
      properties:
        matched:
          type: array
          items:
            type: object
            properties:
              line:
                $ref: "#/components/schemas/StatementLine"
              entry:
                type: object
              day_gap:
                type: integer
                description: Days between the statement line and the ledger entry.
              similarity:
                type: number
                description: Description overlap, 0..1. A tie-breaker only.
        missing:
          type: array
          description: On the statement, not in Finnri. These are importable.
          items:
            $ref: "#/components/schemas/StatementLine"
        extra:
          type: array
          description: In Finnri, not billed. Shown for review, never auto-deleted.
          items:
            type: object
        ignored:
          type: array
          description: Bill payments — real, but never importable as card entries.
          items:
            $ref: "#/components/schemas/StatementLine"
        summary:
          type: object
          properties:
            statement_lines:
              type: integer
            matched_count:
              type: integer
            missing_count:
              type: integer
            extra_count:
              type: integer
            ignored_count:
              type: integer
            missing_amount:
              type: number
            extra_amount:
              type: number
        source:
          type: string
          enum: [screenshots_ai]
          description: Present only when screenshots produced this diff.
        checksum:
          $ref: "#/components/schemas/StatementChecksum"
        credits_charged:
          type: integer
        credits_remaining_today:
          type: integer
        credits_remaining_total:
          type: integer
    StatementChecksum:
      type: object
      description: Advisory screenshot arithmetic; a mismatch never blocks review or import.
      required: [parsed_debits, parsed_credits, parsed_net, expected_net, difference, matches, message]
      properties:
        parsed_debits:
          type: number
        parsed_credits:
          type: number
        parsed_net:
          type: number
        expected_net:
          type: number
          description: Statement total due minus the previous statement's unpaid remainder.
        difference:
          type: number
          description: Parsed net minus expected net.
        matches:
          type: boolean
        message:
          type: string
    CardEMIPlanInput:
      type: object
      required: [title, principal, tenure_months, purchased_on]
      properties:
        title:
          type: string
          maxLength: 120
        merchant:
          type: string
          maxLength: 120
        category:
          type: string
          maxLength: 80
        principal:
          description: The purchase amount, and the amount blocked at the start.
          oneOf:
            - type: number
              exclusiveMinimum: 0
              multipleOf: 0.01
            - type: string
              pattern: "^[0-9]+(\\.[0-9]{1,2})?$"
        annual_rate_pct:
          type: number
          minimum: 0
          maximum: 100
          description: Zero for a no-cost EMI, where every instalment is pure principal.
        tenure_months:
          type: integer
          minimum: 1
          maximum: 360
        purchased_on:
          type: string
          format: date
        first_installment:
          type: string
          format: date
          description: Defaults to one month after the purchase.
        source_entry_id:
          type: [integer, "null"]
          description: An already-logged purchase to convert. The entry is removed.
        notes:
          type: string
    CardEMIInstallment:
      type: object
      required: [id, plan_id, seq, due_date, amount, principal_part, interest_part, status]
      properties:
        id:
          type: integer
        plan_id:
          type: integer
        account_id:
          type: integer
        seq:
          type: integer
        due_date:
          type: string
          format: date
        amount:
          type: number
          description: Principal plus interest — what the statement bills.
        principal_part:
          type: number
          description: The only part that releases limit.
        interest_part:
          type: number
        status:
          type: string
          enum: [scheduled, billed, paid]
          description: >
            scheduled — blocking the limit. billed — on a statement, so inside
            that bill's total and no longer counted as blocked. paid — the
            statement was settled and the principal is released.
        statement_id:
          type: [integer, "null"]
        entry_id:
          type: [integer, "null"]
    CardEMIPlanProgress:
      type: object
      properties:
        installments_total:
          type: integer
        installments_paid:
          type: integer
        principal_remaining:
          type: number
        principal_repaid:
          type: number
        blocked_principal:
          type: number
          description: The part still holding limit — scheduled instalments only.
        amount_remaining:
          type: number
        next_due_date:
          type: string
          format: date
        next_amount:
          type: number
    CardEMIPlan:
      allOf:
        - $ref: "#/components/schemas/CardEMIPlanInput"
        - type: object
          required: [id, account_id, monthly_amount, status]
          properties:
            id:
              type: integer
            account_id:
              type: integer
            monthly_amount:
              type: number
              description: Principal plus interest, from the amortisation schedule.
            total_interest:
              type: number
            currency:
              type: string
            status:
              type: string
              enum: [active, closed, foreclosed]
            installments:
              type: array
              items:
                $ref: "#/components/schemas/CardEMIInstallment"
            progress:
              $ref: "#/components/schemas/CardEMIPlanProgress"
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    SubscriptionInput:
      type: object
      required: [name, amount, next_due_date]
      properties:
        account_id:
          type: [integer, "null"]
          minimum: 1
        name:
          type: string
          maxLength: 120
        merchant:
          type: string
          maxLength: 120
        category:
          type: string
          maxLength: 80
        amount:
          oneOf:
            - type: number
              exclusiveMinimum: 0
              multipleOf: 0.01
            - type: string
              pattern: "^[0-9]+(\\.[0-9]{1,2})?$"
        currency:
          type: string
          const: INR
          default: INR
        billing_interval:
          type: string
          enum: [weekly, monthly, yearly]
          default: monthly
        next_due_date:
          type: string
          format: date
        last_charged_date:
          type: string
          format: date
        status:
          type: string
          enum: [active, paused, cancelled]
          default: active
        reminder_days:
          type: integer
          minimum: 0
          maximum: 30
          default: 3
        notes:
          type: string
    Subscription:
      allOf:
        - $ref: "#/components/schemas/SubscriptionInput"

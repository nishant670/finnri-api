
openapi: 3.1.0
info:
  title: FINNRI MVP API
  version: 1.1.0
servers:
  - url: http://localhost:8080
paths:
  /v1/auth/admin/login:
    post:
      summary: Authenticate an enabled admin with email and PIN
      responses:
        "200": {description: Short-lived admin session issued}
        "403": {description: User is not an enabled admin}
  /v1/auth/admin/logout:
    post:
      summary: Revoke the current admin session
      responses:
        "200": {description: Admin session revoked}
  /v1/auth/logout:
    post:
      summary: Revoke the current user session
      responses:
        "200": {description: User session revoked}
        "401": {description: Session is missing, invalid, or expired}
  /v1/auth/sessions/revoke-all:
    post:
      summary: Revoke every active session for the current user
      responses:
        "200": {description: All user sessions revoked}
        "401": {description: Session is missing, invalid, or expired}
  /v1/split/invites/{token}/preview:
    get:
      summary: Preview an active split invite without authentication
      parameters:
        - in: path
          name: token
          required: true
          schema: {type: string}
      responses:
        "200": {description: Minimal public invite details}
        "404": {description: Invite is invalid, expired, or no longer active}
  /v1/admin/me:
    get:
      summary: Return the current admin identity and role
      responses:
        "200": {description: Current admin}
  /v1/admin/overview:
    get:
      summary: Return dashboard headline metrics for a time window
      responses:
        "200": {description: Admin overview}
  /v1/admin/users:
    get:
      summary: Search and paginate users with masked PII
      responses:
        "200": {description: User page}
  /v1/admin/users/{id}:
    get:
      summary: Return a user support and product-usage profile
      responses:
        "200": {description: User detail}
  /v1/admin/users/{id}/ai-usage:
    get:
      summary: Return paginated AI events for a user
      responses:
        "200": {description: AI usage page}
  /v1/admin/users/{id}/credits:
    get:
      summary: Return a user's credit summary, grants, and ledger
      responses:
        "200": {description: User credits}
  /v1/admin/users/{id}/activity:
    get:
      summary: Return a merged user activity timeline
      responses:
        "200": {description: Activity timeline}
  /v1/admin/users/{id}/credits/adjustments:
    post:
      summary: Grant a manual credit adjustment to a user
      responses:
        "201": {description: Credit grant created}
  /v1/admin/ai/metrics:
    get:
      summary: Return aggregate AI cost and usage metrics
      responses:
        "200": {description: AI metrics}
  /v1/admin/ai/metrics/timeseries:
    get:
      summary: Return daily AI event, credit, cost, and success metrics
      responses:
        "200": {description: Daily AI series}
  /v1/admin/ai/usage:
    get:
      summary: Browse raw AI usage events
      responses:
        "200": {description: AI usage page}
  /v1/admin/ai/limit-events:
    get:
      summary: Browse AI credit and daily-cap limit events
      responses:
        "200": {description: Limit event page}
  /v1/admin/ai/model-pricing:
    get:
      summary: List AI model pricing inputs
      responses:
        "200": {description: Model pricing}
    put:
      summary: Upsert AI model pricing inputs
      responses:
        "200": {description: Model pricing saved}
  /v1/admin/credits/adjustments:
    post:
      summary: Create a user or guest credit adjustment
      responses:
        "201": {description: Credit grant created}
  /v1/admin/credits/summary:
    get:
      summary: Return granted, consumed, expired, and outstanding credits
      responses:
        "200": {description: Credit liability summary}
  /v1/admin/credits/ledger:
    get:
      summary: Browse the global credit ledger
      responses:
        "200": {description: Credit ledger page}
  /v1/admin/subscriptions:
    get:
      summary: Browse user subscriptions
      responses:
        "200": {description: Subscription page}
  /v1/admin/revenue:
    get:
      summary: Return modelled recurring revenue metrics
      responses:
        "200": {description: Modelled revenue metrics}
  /v1/admin/plans:
    get:
      summary: List editable billing plans
      responses:
        "200": {description: Billing plans}
  /v1/admin/plans/{code}:
    put:
      summary: Update a billing plan
      responses:
        "200": {description: Billing plan saved}
  /v1/admin/billing/lifetime-quotes:
    get:
      summary: Browse lifetime quote requests
      responses:
        "200": {description: Lifetime quote page}
  /v1/admin/billing/lifetime-quotes/{id}:
    patch:
      summary: Update lifetime quote status and notes
      responses:
        "200": {description: Lifetime quote updated}
  /v1/admin/ai/abuse-blocks:
    get:
      summary: Browse AI abuse blocks
      responses:
        "200": {description: Abuse block page}
    post:
      summary: Create an AI abuse block
      responses:
        "201": {description: Abuse block created}
  /v1/admin/ai/abuse-blocks/{id}:
    patch:
      summary: Update or lift an AI abuse block
      responses:
        "200": {description: Abuse block updated}
  /v1/admin/feedback:
    get:
      summary: Browse and filter product feedback
      responses:
        "200": {description: Feedback page}
  /v1/admin/feedback/stats:
    get:
      summary: Return feedback counts and open-item age
      responses:
        "200": {description: Feedback statistics}
  /v1/admin/feedback/{id}:
    patch:
      summary: Update feedback status and admin notes
      responses:
        "200": {description: Feedback updated}
  /v1/admin/analytics/signups:
    get:
      summary: Return daily or weekly signup counts
      responses:
        "200": {description: Signup series}
  /v1/admin/analytics/activation:
    get:
      summary: Return seven-day activation funnel metrics
      responses:
        "200": {description: Activation funnel}
  /v1/admin/analytics/retention:
    get:
      summary: Return signup-week retention cohorts
      responses:
        "200": {description: Retention cohort grid}
  /v1/admin/analytics/engagement:
    get:
      summary: Return DAU, WAU, MAU, and stickiness series
      responses:
        "200": {description: Engagement series}
  /v1/admin/analytics/feature-adoption:
    get:
      summary: Return feature and guest-conversion adoption metrics
      responses:
        "200": {description: Feature adoption metrics}
  /v1/admin/audit-log:
    get:
      summary: Browse immutable admin action records
      responses:
        "200": {description: Audit log page}
  /v1/admin/health:
    get:
      summary: Return database, maintenance, circuit, and notification health
      responses:
        "200": {description: Operational health}
  /v1/admin/export/{resource}:
    get:
      summary: Export users, subscriptions, or AI usage as CSV
      responses:
        "200": {description: CSV export}
  /v1/admin/admin-users:
    get:
      summary: List admin identities
      responses:
        "200": {description: Admin identities}
    post:
      summary: Create or enable an admin identity
      responses:
        "201": {description: Admin identity created}
  /v1/admin/admin-users/{id}:
    patch:
      summary: Change an admin role or disabled state
      responses:
        "200": {description: Admin identity updated}
  /v1/monthly-review:
    get:
      summary: Return the review of a completed calendar month
      description: >-
        The story behind the monthly review notification, recomputed from the
        ledger rather than replayed from what was sent — a month can still be
        edited after it closes, and the ledger is the truth. Only months that
        have already ended are reviewable.
      parameters:
        - in: query
          name: month
          description: "`YYYY-MM`. Defaults to the most recently completed month."
          schema:
            type: string
            pattern: "^[0-9]{4}-[0-9]{2}$"
        - in: query
          name: tz
          schema:
            type: string
            default: Asia/Kolkata
      responses:
        "200":
          description: The month's review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyReview"
        "422":
          description: The month is malformed, or has not finished yet
  /v1/monthly-review/send:
    post:
      summary: Emit this user's review notification for the completed month
      description: >-
        The same emission the scheduled job performs, for the calling user only,
        and equally idempotent — a second call in the same month sends nothing.
        It exists because the job's trigger is a date, so without it the only way
        to see what the 1st produces is to wait for it.
      responses:
        "200":
          description: Whether a review was sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  month:
                    type: string
                  sent:
                    type: boolean
                    description: False when the month was already reviewed, or held too little to review.
  /v1/dashboard:
    get:
      summary: Return the deterministic spending dashboard for a date range
      parameters:
        - in: query
          name: start_date
          schema:
            type: string
            format: date
        - in: query
          name: end_date
          schema:
            type: string
            format: date
        - in: query
          name: tz
          schema:
            type: string
            default: Asia/Kolkata
      responses:
        "200":
          description: Dashboard calculated from owned transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "422":
          description: Invalid or oversized date range
  /v1/insights:
    get:
      deprecated: true
      summary: Compatibility alias for GET /v1/dashboard
      responses:
        "200":
          description: Dashboard calculated from owned transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /v1/recurring-candidates/decision:
    post:
      summary: Persist a review decision for a detected recurring candidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecurringCandidateDecisionInput"
      responses:
        "200":
          description: Decision saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringCandidateDecision"
        "422":
          description: Invalid decision fields
  /v1/recurring-candidates/track:
    post:
      summary: Create subscriptions for detected recurring candidates in one call
      description: >-
        Candidate figures are recomputed server-side; the request only names
        keys. An empty or omitted candidate_keys tracks every current candidate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackRecurringCandidatesInput"
      responses:
        "200":
          description: Subscriptions created and candidates marked tracked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackRecurringCandidatesResponse"
        "422":
          description: Invalid date range
  /v1/user:
    delete:
      summary: Permanently delete the authenticated user and owned data
      responses:
        "200":
          description: User and owned data deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteUserResponse"
        "401":
          description: Missing or invalid session
        "404":
          description: User not found
        "500":
          description: Delete failed
  /v1/parse:
    post:
      summary: Parse audio/text into a transaction draft, or answer a question about the ledger
      description: >-
        One channel, two directions. The parser classifies the input as a
        capture or a question. A capture returns a draft entry with
        `stage: "draft"`. A question returns `stage: "answer"` and a
        `LedgerAnswer` whose figures are computed from the database — the model
        never produces a number. Clients must branch on `stage`: an answer must
        never be turned into a transaction.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                audio:
                  type: string
                  format: binary
                hint_text:
                  type: string
                tz:
                  type: string
                  default: Asia/Kolkata
      responses:
        "200":
          description: A transaction draft, or an answer to a question about recorded transactions
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ExpenseOrIncomeEntry"
                  - $ref: "#/components/schemas/LedgerAnswerResponse"
        "422":
          description: Could not parse
  /v1/entries:
    post:
      summary: Create a transaction entry
      parameters:
        - in: header
          name: Idempotency-Key
          description: Reuse the same key when retrying one logical create request.
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalEntry"
      responses:
        "201":
          description: Entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedEntry"
        "400":
          description: Invalid payload
        "422":
          description: Field validation or account ownership failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "500":
          description: Database error
    get:
      summary: List all transaction entries
      parameters:
        - in: query
          name: type
          schema:
            type: string
            enum: [expense, income]
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: mode
          schema:
            type: string
            enum: [Cash, Bank Account, UPI, Credit Card, Wallets]
        - in: query
          name: q
          description: Case-insensitive search across title, merchant, and notes.
          schema:
            type: string
        - in: query
          name: tag
          description: Return only entries that include this tag.
          schema:
            type: string
        - in: query
          name: account_id
          description: Return only entries linked to this owned account.
          schema:
            type: integer
        - in: query
          name: min_amount
          schema:
            type: string
        - in: query
          name: max_amount
          schema:
            type: string
        - in: query
          name: start_date
          schema:
            type: string
            format: date
        - in: query
          name: end_date
          schema:
            type: string
            format: date
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: page_size
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - in: query
          name: sort
          description: >-
            Result order. Amount sorts rank across the whole filtered set, so a
            client that groups rows by day has to stop doing so to render them.
          schema:
            type: string
            enum: [newest, oldest, highest, lowest]
            default: newest
        - in: query
          name: uncategorised
          description: >-
            Return only entries with no category at all. Misc is excluded — it is
            a real category the parser and the entry form both file things under
            deliberately, not an empty one.
          schema:
            type: string
            enum: ["1", "true"]
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryPage"
        "422":
          description: Invalid filters
        "500":
          description: Database error
  /v1/entries/export:
    get:
      summary: Export filtered transaction entries as CSV or as a statement PDF
      description: >-
        Both formats come off the same filtered query. The PDF is titled with
        the range the filters describe rather than a month chosen by the server.
      parameters:
        - in: query
          name: format
          schema:
            type: string
            enum: [csv, pdf]
            default: csv
        - in: query
          name: tz
          description: IANA zone used only to timestamp the PDF's "Generated" line.
          schema:
            type: string
        - in: query
          name: type
          schema:
            type: string
            enum: [expense, income]
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: mode
          schema:
            type: string
            enum: [Cash, Bank Account, UPI, Credit Card, Wallets]
        - in: query
          name: q
          description: Case-insensitive search across title, merchant, and notes.
          schema:
            type: string
        - in: query
          name: tag
          description: Return only entries that include this tag.
          schema:
            type: string
        - in: query
          name: account_id
          description: Return only entries linked to this owned account.
          schema:
            type: integer
        - in: query
          name: min_amount
          schema:
            type: string
        - in: query
          name: max_amount
          schema:
            type: string
        - in: query
          name: start_date
          schema:
            type: string
            format: date
        - in: query
          name: end_date
          schema:
            type: string
            format: date
      responses:
        "200":
          description: CSV export containing owned entries that match filters
          content:
            text/csv:
              schema:
                type: string
        "422":
          description: Invalid filters, unsupported format, or export row limit exceeded
        "500":
          description: Export failed
  /v1/refundables:
    get:
      summary: List refundable expense entries
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, received, written_off, all]
            default: pending
      responses:
        "200":
          description: Refundable entries ordered by expected date
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedEntry"
        "422":
          description: Invalid status filter
  /v1/refundables/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    patch:
      summary: Update a refundable entry's settlement status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status:
                  type: string
                  enum: [pending, received, written_off]
      responses:
        "200":
          description: Updated refundable entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedEntry"
        "404":
          description: Refundable entry not found
        "422":
          description: Invalid refund status
  /v1/merchants/suggestions:
    get:
      summary: Suggest merchants from the authenticated user's entry history
      parameters:
        - in: query
          name: q
          description: Optional case-insensitive merchant substring to match.
          schema:
            type: string
            maxLength: 120
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 25
            default: 10
      responses:
        "200":
          description: Merchant autocomplete suggestions derived from owned entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantSuggestions"
        "422":
          description: Invalid query or limit
        "500":
          description: Suggestions failed
  /v1/categories:
    get:
      summary: List the canonical transaction categories
      description: >-
        The single source of truth for every client's category picker. The
        response is identical for all users and does not change between
        requests, so clients may cache it. Clients must not keep their own copy:
        a hardcoded list is how "Electronics", "Health" and "Other" once reached
        a picker while Travel, Family/Gifts and Misc fell out of it.
      responses:
        "200":
          description: The canonical category list and the confirm-first fallback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Categories"
        "401":
          description: Missing or invalid session
  /v1/reports/transactions/summary:
    get:
      summary: Return filtered transaction report rollups
      parameters:
        - in: query
          name: type
          schema:
            type: string
            enum: [expense, income]
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: mode
          schema:
            type: string
            enum: [Cash, Bank Account, UPI, Credit Card, Wallets]
        - in: query
          name: q
          description: Case-insensitive search across title, merchant, and notes.
          schema:
            type: string
        - in: query
          name: tag
          description: Return only entries that include this tag.
          schema:
            type: string
        - in: query
          name: account_id
          description: Return only entries linked to this owned account.
          schema:
            type: integer
        - in: query
          name: min_amount
          schema:
            type: string
        - in: query
          name: max_amount
          schema:
            type: string
        - in: query
          name: start_date
          schema:
            type: string
            format: date
        - in: query
          name: end_date
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Summary and read-only rollups for owned entries matching filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionReport"
        "422":
          description: Invalid filters
        "500":
          description: Report failed
  /v1/accounts:
    get:
      summary: List accounts owned by the authenticated user, with figures derived from their transactions
      parameters:
        - in: query
          name: tz
          required: false
          schema:
            type: string
          description: IANA zone deciding which calendar month "this month" is. Defaults to the server's TZ_DEFAULT.
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountWithSummary"
        "500":
          description: Account activity could not be loaded
    post:
      summary: Create an account/payment source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
  /v1/account-providers:
    get:
      summary: List structured account providers and their matching aliases
      parameters:
        - in: query
          name: type
          required: false
          schema:
            type: string
            enum: [cash, upi, bank, credit_card, debit_card, wallet, other]
          description: Return only providers that support this account type.
      responses:
        "200":
          description: Provider catalogue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountProvider"
        "422":
          description: Invalid account type
  /v1/accounts/{id}/statements/alert:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
        description: Credit card account id
    post:
      summary: Parse an SMS or email bill alert and upsert its card statement
      description: >
        The authenticated intake channel submits alert text; this endpoint does
        not request mailbox or SMS permissions. Model-produced amounts must
        occur in the source text. The existing unique statement key makes
        retries idempotent, and a priced manual statement is never overwritten.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatementAlertInput"
      responses:
        "200":
          description: Existing statement updated, or a manual statement preserved
          headers:
            X-Finnri-Manual-Preserved:
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardStatement"
        "201":
          description: Statement created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardStatement"
        "402":
          description: AI plan or credits required
        "404":
          description: Card not found
        "422":
          description: Invalid or unrecognised alert
        "502":
          description: AI provider could not parse the alert
  /v1/accounts/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    put:
      summary: Update an owned account or make it the default
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountInput"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "422":
          description: Invalid account fields
        "404":
          description: Account not found
    delete:
      summary: Delete an unused owned account
      responses:
        "200":
          description: Deleted
        "409":
          description: Account is used by transactions or is the user's only account
        "404":
          description: Account not found
  /v1/accounts/{id}/paid-off:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    post:
      summary: Reset a statement-less credit card's ledger outstanding after it is paid off
      responses:
        "200":
          description: Card fallback balance reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "409":
          description: Card is managed by statements; record a statement payment instead
        "422":
          description: Account is not a credit card
  /v1/entries/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    get:
      summary: Get an owned transaction
      responses:
        "200":

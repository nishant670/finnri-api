          required: [id, user_id, name, amount, currency, billing_interval, next_due_date, status, reminder_days, days_until_due, due_state, created_at, updated_at]
          properties:
            id:
              type: integer
            user_id:
              type: integer
            account:
              $ref: "#/components/schemas/Account"
            days_until_due:
              type: integer
            due_state:
              type: string
              enum: [scheduled, due_soon, overdue, paused, cancelled, unknown]
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    Notification:
      type: object
      required: [id, user_id, type, title, body, created_at, updated_at]
      properties:
        id:
          type: integer
        user_id:
          type: integer
        type:
          type: string
        title:
          type: string
        body:
          type: string
        action_url:
          type: string
        read_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    NotificationPage:
      type: object
      required: [notifications, unread_count, page, page_size, total, total_pages]
      properties:
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        unread_count:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
    SplitFriendInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
    SplitFriend:
      type: object
      required: [id, user_id, name, archived, created_at, updated_at]
      properties:
        id:
          type: integer
        user_id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        archived:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SplitGroupInput:
      type: object
      required: [name, friend_ids]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [trip, home, couple, other]
          default: other
          description: >-
            What the group is for. Only a trip offers trip dates on the group
            screen. Shared with every member.
        friend_ids:
          type: array
          minItems: 1
          items:
            type: integer
    PendingSplitGroupInvite:
      type: object
      required: [id, token, group_id, group_name, owner_name, created_at]
      properties:
        id:
          type: integer
        token:
          type: string
          description: Invite token to POST to /v1/split/invites/{token}/accept.
        group_id:
          type: integer
        group_name:
          type: string
        owner_name:
          type: string
        created_at:
          type: string
          format: date-time
    SplitGroupMemberInvite:
      type: object
      required: [friend_id, name, status]
      properties:
        friend_id:
          type: integer
        name:
          type: string
        status:
          type: string
          enum: [notified, invite_created, no_contact]
          description: >-
            notified — they have a Finnri account and an invite is waiting in
            it. invite_created — no account yet, so the link has to be shared.
            no_contact — the friend has no email or phone, so nobody could be
            reached.
    SplitGroupDefaultSplitShare:
      type: object
      required: [slot]
      properties:
        slot:
          type: string
          description: >-
            "owner" for the group owner, otherwise a group member's friend id as
            a string.
        weight:
          type: string
          description: >-
            Percentage or share count, depending on tab. Omitted when tab is
            "equally".
    SplitGroupDefaultSplit:
      type: object
      required: [payer, tab, participants]
      description: >-
        The split every new expense in the group starts from, shared by all
        members. Slots are anchored on the group owner rather than the viewer so
        the stored default names the same people for everybody. Any active
        member may change it.
      properties:
        payer:
          type: string
        full_amount:
          type: boolean
          description: The payer is owed the whole expense and carries none of it.
        tab:
          type: string
          enum: [equally, percentages, shares]
        participants:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SplitGroupDefaultSplitShare"
    SplitGroupDefaultSplitInput:
      type: object
      properties:
        default_split:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/SplitGroupDefaultSplit"
          description: Null clears the group's default and restores the equal split.
    SplitGroupMember:
      type: object
      required: [id, user_id, group_id, friend_id]
      properties:
        id:
          type: integer
        user_id:
          type: integer
        group_id:
          type: integer
        friend_id:
          type: integer
        friend:
          $ref: "#/components/schemas/SplitFriend"
    SplitGroup:
      type: object
      required: [id, user_id, name, archived, kind, created_at, updated_at]
      properties:
        id:
          type: integer
        user_id:
          type: integer
        name:
          type: string
        archived:
          type: boolean
        kind:
          type: string
          enum: [trip, home, couple, other]
        photo_url:
          type: string
          description: >-
            The group's picture, always a URL issued by POST /v1/upload. A photo
            belongs to the group rather than to whoever picked it, so every
            member sees the same one. Empty when the group has none.
        default_split:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/SplitGroupDefaultSplit"
        owner_name:
          type: string
          description: Display name of the member who owns the group.
        member_invites:
          type: array
          description: >-
            What happened to the people just added, returned only on a create or
            update. Adding somebody raises an invite; they still see nothing
            until they accept it.
          items:
            $ref: "#/components/schemas/SplitGroupMemberInvite"
        viewer_friend_id:
          type: integer
          nullable: true
          description: >-
            Which of the group's member friend rows is the caller. Absent for
            the owner, who is always the "owner" slot.
        viewer_members:
          type: array
          description: >-
            The group's whole roster written in the caller's own friend rows,
            themselves included and flagged. Prefer it over `members` for
            anything drawn on screen: `members` is the owner's list of the
            owner's own rows, so to any other member it names people their
            account cannot resolve, and leaves out the owner entirely.
          items:
            $ref: "#/components/schemas/SplitGroupViewerMember"
        members:
          type: array
          items:
            $ref: "#/components/schemas/SplitGroupMember"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SplitGroupViewerMember:
      type: object
      required: [slot, friend_id, name, is_viewer]
      properties:
        slot:
          type: string
          description: >-
            The person in the group owner's namespace: "owner", or an
            owner-side split friend id rendered as text.
        friend_id:
          type: integer
          description: >-
            The caller's own friend row for this person. Zero for the caller
            themselves, and zero for anybody they have no row for yet — such a
            person can be shown but not settled with.
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        is_viewer:
          type: boolean
    SplitBillViewerShare:
      type: object
      required: [slot, friend_id, name, is_viewer, paid, share]
      properties:
        slot:
          type: string
          description: >-
            The person in the group owner's namespace. On a bill with no group
            it is the caller's own friend id, or "self" for the caller.
        friend_id:
          type: integer
          description: The caller's own friend row; zero for the caller.
        name:
          type: string
        is_viewer:
          type: boolean
        paid:
          type: number
          multipleOf: 0.01
          description: What this person laid out. Only the payer is non-zero.
        share:
          type: number
          multipleOf: 0.01
          description: What the bill makes theirs to carry.
    SplitParticipantInput:
      type: object
      required: [friend_id, share_amount, direction]
      properties:
        friend_id:
          type: integer
        share_amount:
          type: number
          multipleOf: 0.01
          exclusiveMinimum: 0
        direction:
          type: string
          enum: [friend_owes_user, user_owes_friend]
    SplitParticipant:
      allOf:
        - $ref: "#/components/schemas/SplitParticipantInput"
        - type: object
          required: [id, user_id, bill_id]
          properties:
            id:
              type: integer
            user_id:
              type: integer
            bill_id:
              type: integer
            friend:
              $ref: "#/components/schemas/SplitFriend"
    SplitBillInput:
      type: object
      required: [title, total_amount, date, participants]
      properties:
        entry_id:
          type: [integer, "null"]
        group_id:
          type: [integer, "null"]
        title:
          type: string
        total_amount:
          type: number
          multipleOf: 0.01
          exclusiveMinimum: 0
        currency:
          type: string
          enum: [INR]
          default: INR
        date:
          type: string
          format: date
        notes:
          type: string
        participants:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SplitParticipantInput"
    SplitBill:
      type: object
      required: [id, user_id, title, total_amount, currency, date, participants, created_at, updated_at]
      properties:
        id:
          type: integer
        user_id:
          type: integer
        entry_id:
          type: [integer, "null"]
        group_id:
          type: [integer, "null"]
        group:
          $ref: "#/components/schemas/SplitGroup"
        title:
          type: string
        total_amount:
          type: number
          multipleOf: 0.01
        currency:
          type: string
          enum: [INR]
        date:
          type: string
          format: date
        notes:
          type: string
        participants:
          type: array
          items:
            $ref: "#/components/schemas/SplitParticipant"
        viewer_shares:
          type: array
          description: >-
            This bill restated for whoever asked for it: who paid, and what each
            person carries, named in the caller's own friend rows. Prefer it
            over `participants` on anything that says "you". `participants`
            records only the debts of the bill's author, against friend rows
            only they own, with `direction` stated from their side — read
            literally by another member of the group it reports the author's
            payments and lendings as the reader's own.
          items:
            $ref: "#/components/schemas/SplitBillViewerShare"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SplitSettlementInput:
      type: object
      required: [friend_id, amount, direction, date]
      properties:
        friend_id:
          type: integer
        group_id:
          type: integer
          nullable: true
          description: >-
            The group whose expenses this payment closes. Omit for a settlement
            recorded straight against a friend. A settlement that names a group
            is deleted with it: once the group's expenses are gone it has
            nothing left to settle, and applying it anyway leaves a balance no
            screen can account for.
        amount:
          type: number
          multipleOf: 0.01
          exclusiveMinimum: 0
        direction:
          type: string
          enum: [friend_paid_user, user_paid_friend]
        date:
          type: string
          format: date
        notes:
          type: string
    SplitSettlement:
      allOf:
        - $ref: "#/components/schemas/SplitSettlementInput"
        - type: object
          required: [id, user_id, created_at, updated_at]
          properties:
            id:
              type: integer
            user_id:
              type: integer
            friend:
              $ref: "#/components/schemas/SplitFriend"
            status:
              type: string
              enum: [pending, confirmed, denied]
              description: >-
                Whether the other side agrees this payment happened. Recorded
                against a friend with no Finnri account there is nobody to ask,
                so the settlement is created confirmed. Pending settlements
                still count in every balance; a denial reverses them.
            counterparty_user_id:
              type: integer
              nullable: true
              description: The Finnri account that must confirm or deny this settlement.
            responded_at:
              type: string
              format: date-time
              nullable: true
            recorded_by_name:
              type: string
              description: Response-only. Who recorded the settlement, for a decision prompt.
            group_name:
              type: string
              description: Response-only. The group the settlement was recorded in.
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    SplitBalance:
      type: object
      required: [friend, total_owed_by_friend, total_owed_to_friend, net_balance]
      properties:
        friend:
          $ref: "#/components/schemas/SplitFriend"
        total_owed_by_friend:
          type: number
          multipleOf: 0.01
        total_owed_to_friend:
          type: number
          multipleOf: 0.01
        net_balance:
          type: number
          multipleOf: 0.01
    EMICalculationInput:
      type: object
      required: [principal_amount, annual_interest_rate_percent, tenure_months]
      properties:
        principal_amount:
          type: number
          multipleOf: 0.01
          exclusiveMinimum: 0
        annual_interest_rate_percent:
          type: number
          minimum: 0
          maximum: 100
        tenure_months:
          type: integer
          minimum: 1
          maximum: 360
        currency:
          type: string
          enum: [INR]
          default: INR
    EMICalculation:
      type: object
      required: [principal_amount, currency, annual_interest_rate_percent, tenure_months, monthly_emi, total_payment, total_interest, schedule]
      properties:
        principal_amount:
          type: number
          multipleOf: 0.01
        currency:
          type: string
          enum: [INR]
        annual_interest_rate_percent:
          type: number
        tenure_months:
          type: integer
        monthly_emi:
          type: number
          multipleOf: 0.01
        total_payment:
          type: number
          multipleOf: 0.01
        total_interest:
          type: number
          multipleOf: 0.01
        schedule:
          type: array
          maxItems: 360
          items:
            $ref: "#/components/schemas/EMIScheduleMonth"
    EMIScheduleMonth:
      type: object
      required: [month, opening_balance, payment_amount, principal_amount, interest_amount, closing_balance]
      properties:
        month:
          type: integer
        opening_balance:
          type: number
          multipleOf: 0.01
        payment_amount:
          type: number
          multipleOf: 0.01
        principal_amount:
          type: number
          multipleOf: 0.01
        interest_amount:
          type: number
          multipleOf: 0.01
        closing_balance:
          type: number
          multipleOf: 0.01
    ValidationError:
      type: object
      required: [error, fields]
      properties:
        error:
          const: invalid_entry
        fields:
          type: object
          additionalProperties:
            type: string
    DeleteUserResponse:
      type: object
      required: [message]
      properties:
        message:
          const: account deleted
security:
  - bearerAuth: []
